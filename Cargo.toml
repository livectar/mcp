[workspace]
members = [
    "crates/mcp-protocol",
    "crates/mcp-sdk",
    "crates/mcp-transport",
    "crates/mcp-testkit",
    "servers/ping",
    "servers/google",
    "servers/telegram-bot",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/livectar/mcp"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tower = { version = "0.5", features = ["util"] }
